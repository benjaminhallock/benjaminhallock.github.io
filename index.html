<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Benjamin Hallock — Software Engineer & Photographer</title>
    <meta
      name="description"
      content="The index of Benjamin Hallock: software engineering projects, writing on the web, and photography. Every post is a number." />
    <link rel="canonical" href="https://benjaminhallock.github.io/" />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Benjamin Hallock — Software Engineer & Photographer" />
    <meta
      property="og:description"
      content="Projects, writing and photography. Every post is a number." />
    <meta property="og:url" content="https://benjaminhallock.github.io/" />
    <meta property="og:image" content="https://benjaminhallock.github.io/img/1.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Benjamin Hallock — Software Engineer & Photographer" />
    <meta
      name="twitter:description"
      content="Projects, writing and photography. Every post is a number." />
    <meta name="twitter:image" content="https://benjaminhallock.github.io/img/1.webp" />

    <meta name="theme-color" content="#060607" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="/css/site.css" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Benjamin Hallock",
        "url": "https://benjaminhallock.github.io/",
        "jobTitle": "Software Engineer",
        "sameAs": ["https://github.com/benjaminhallock"],
        "knowsAbout": ["Web Development", "React", "Node.js", "Photography"]
      }
    </script>

    <script src="/js/content.js" defer></script>
    <script src="/js/site.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#feed">Skip to posts</a>

    <div class="bg" id="bg" aria-hidden="true"></div>

    <button
      type="button"
      class="icon-btn rail-reveal"
      id="rail-reveal"
      aria-controls="rail"
      aria-expanded="false"
      aria-label="Show the post index">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <div class="app">
      <aside class="rail" id="rail" aria-label="Profile and post index">
        <div class="profile">
          <div class="profile-top">
            <img
              class="avatar"
              src="/img/bengi.webp"
              alt="Benjamin Hallock"
              width="58"
              height="58" />
            <div>
              <h1 class="profile-name">Benjamin Hallock</h1>
              <p class="profile-handle">@benjaminhallock</p>
            </div>
          </div>
           <p class="profile-bio">
             Software engineer and photographer. I build for the web, and I shoot when the light is
             right.
           </p>
           <ul class="profile-stats">
             <li><b data-stat="blog">5</b><span>Blog</span></li>
             <li><b data-stat="photos">16</b><span>Photos</span></li>
           </ul>
          <div class="profile-links">
            <a href="https://github.com/benjaminhallock" rel="me">GitHub</a>
            <a href="mailto:benjaminhallock@gmail.com">Email</a>
            <a href="/humans.txt">About</a>
          </div>
        </div>

        <div class="tabs" id="tabs" role="tablist" aria-label="Filter posts">
          <button class="tab" role="tab" type="button" data-filter="all" aria-selected="true">
            All
          </button>
           <button class="tab" role="tab" type="button" data-filter="blog" aria-selected="false">
             Blog
          </button>
          <button class="tab" role="tab" type="button" data-filter="photos" aria-selected="false">
            Photos
          </button>
        </div>

        <ol class="index" id="index" aria-label="Posts"></ol>

        <div class="rail-foot">
          <span>Navigate with <kbd>↑</kbd><kbd>↓</kbd> or the wheel</span>
          <button
            type="button"
            class="icon-btn"
            id="rail-toggle"
            aria-controls="rail"
            aria-expanded="true"
            aria-label="Hide the post index">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" />
            </svg>
          </button>
        </div>
      </aside>

      <main class="stage">
        <div class="stage-bar">
          <div class="left">
            <span class="counter" id="counter"></span>
          </div>
          <span class="stage-title">The Index</span>
          <div class="right">
            <button
              type="button"
              class="icon-btn"
              id="prev-btn"
              aria-label="Previous post">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 15l-6-6-6 6" /></svg>
            </button>
            <button
              type="button"
              class="icon-btn"
              id="next-btn"
              aria-label="Next post">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
            </button>
          </div>
        </div>
        <div class="feed" id="feed"></div>
      </main>
    </div>
  </body>
</html>
